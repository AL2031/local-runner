name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # llama.cpp build bundled into the app. All computers in a cluster must run the same one.
  # (The "latest" release on that repo is an empty placeholder, so we pin a real build.)
  LLAMA_TAG: b11575

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Compile PyInstaller's own launcher (the "bootloader") from source. The ready-made one is shared by thousands
          # of programs and antivirus tools keep its fingerprint on file, which causes false alarms.
          # If compiling fails here, fall back to the normal ready-made one so the build still works.
          pip install pyinstaller --no-binary pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Could not compile the launcher on this machine; using the standard one"
            pip install pyinstaller
          }
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Download the llama.cpp engine (Vulkan build, works on any GPU and falls back to CPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:LLAMA_TAG --repo ggml-org/llama.cpp --pattern "llama-*-bin-win-vulkan-x64.zip" --dir engine_dl
          Expand-Archive (Get-ChildItem engine_dl\*.zip | Select-Object -First 1).FullName engine_tmp
          $exe = Get-ChildItem engine_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          New-Item -ItemType Directory engine | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" engine -Recurse
          if (-not ((Test-Path engine\ggml-rpc-server.exe) -or (Test-Path engine\rpc-server.exe))) { throw "This llama.cpp build has no RPC server, so clustering would not work" }
          # Ship the Microsoft C++ runtime next to the engine so nothing has to be installed system-wide (no admin needed).
          # Source: the redistributable folder inside the runner's Visual Studio install (the official app-local copy).
          $crt = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($crt) {
            Write-Host "Using the runtime from $($crt.FullName)"
            Copy-Item "$($crt.FullName)\*.dll" engine -Force
          } else {
            Write-Host "No Visual Studio runtime folder found; trying System32 and Python instead"
            foreach ($d in "$env:SystemRoot\System32", (Split-Path (Get-Command python).Source)) {
              Get-ChildItem $d -File | Where-Object { $_.Name -match '^(vcruntime140|msvcp140|concrt140)' } | Copy-Item -Destination engine -Force
            }
          }
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Test-Path "engine\$n")) { throw "The Microsoft C++ runtime file $n was not found on the build machine" }
          }
          Get-ChildItem engine | Select-Object -First 30 Name

      - name: Build the app
        run: python build.py

      - name: Smoke test the built app
        continue-on-error: true
        run: |
          Start-Process dist\LocalRunner\LocalRunner.exe
          Start-Sleep -Seconds 25
          (Invoke-WebRequest http://127.0.0.1:1234/api/specs -UseBasicParsing).Content
          (Invoke-WebRequest http://127.0.0.1:1234/api/cluster -UseBasicParsing).Content
          (Invoke-WebRequest http://127.0.0.1:1234/ -UseBasicParsing).StatusCode
          Stop-Process -Name LocalRunner -Force

      - name: Zip the portable build
        run: Compress-Archive -Path dist\LocalRunner -DestinationPath LocalRunner-Windows.zip

      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Show checksums (needed when reporting a false alarm to an antivirus vendor)
        run: |
          Get-FileHash installer\LocalRunner-Setup.exe, LocalRunner-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: LocalRunner-Windows
          path: |
            installer/LocalRunner-Setup.exe
            LocalRunner-Windows.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/LocalRunner-Setup.exe
            LocalRunner-Windows.zip
